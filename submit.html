<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share your experience — EchoWall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430; --paper:#FAF7F2; --paper-dim:#F1ECE2;
    --gold:#E8A33D; --sage:#7C9885; --rose:#D88C9A; --line:rgba(27,36,48,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{max-width:480px; width:100%; background:white; border:1px solid var(--line); border-radius:20px; padding:36px 28px;}
  h1{font-family:'Fraunces',serif; font-weight:700; font-size:1.6rem; margin-bottom:8px;}
  p.sub{color:#6b7280; font-size:0.95rem; margin-bottom:28px;}
  label{display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px; margin-top:18px;}
  input[type=text], textarea{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px;
    font-family:'Inter',sans-serif; font-size:0.95rem; background:var(--paper-dim);
  }
  textarea{resize:vertical; min-height:90px;}
  input:focus, textarea:focus{outline:2px solid var(--sage); outline-offset:1px;}
  .stars{display:flex; gap:6px; margin-top:4px;}
  .star{font-size:1.8rem; cursor:pointer; color:var(--line); background:none; border:none; padding:0;}
  button{cursor:pointer; font-family:'Inter',sans-serif;}
  button.submit{
    width:100%; margin-top:26px; background:var(--ink); color:var(--paper);
    border:none; border-radius:100px; padding:14px; font-weight:600; font-size:0.95rem;
  }
  button.submit:disabled{opacity:0.6; cursor:not-allowed;}
  .msg{margin-top:16px; font-size:0.88rem; padding:12px 14px; border-radius:10px; display:none;}
  .msg.success{background:#eaf3ec; color:#3d6b4a; display:block;}
  .msg.error{background:#fbeaea; color:#a13b3b; display:block;}
  .done{display:none; text-align:center;}
  .done h1{margin-bottom:10px;}
  .done p{color:#6b7280; font-size:0.95rem;}
</style>
</head>
<body>

<div class="card" id="formCard">
  <h1 id="formTitle">Share your experience</h1>
  <p class="sub" id="formSub">Two questions, takes under a minute. Thank you.</p>

  <form id="testimonialForm">
    <label for="name">Your name</label>
    <input type="text" id="name" required>
    <label for="role">Your role or business (optional)</label>
    <input type="text" id="role" placeholder="e.g. Studio owner">
    <label>Rating</label>
    <div class="stars" id="stars">
      <button type="button" class="star" data-value="1">★</button>
      <button type="button" class="star" data-value="2">★</button>
      <button type="button" class="star" data-value="3">★</button>
      <button type="button" class="star" data-value="4">★</button>
      <button type="button" class="star" data-value="5">★</button>
    </div>
    <label for="quote">What was your experience like?</label>
    <textarea id="quote" required placeholder="Tell us what stood out..."></textarea>
    <button type="submit" class="submit" id="submitBtn">Submit</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<div class="card done" id="doneCard">
  <h1>Thank you</h1>
  <p>Your testimonial has been submitted and will appear once reviewed.</p>
</div>

<div class="card" id="errorCard" style="display:none;">
  <h1>Link not found</h1>
  <p class="sub">This submission link isn't linked to a business. Double check the link you were given.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://lcutykiqvezdpdbsdjon.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjdXR5a2lxdmV6ZHBkYnNkam9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MjA0NzgsImV4cCI6MjEwMTE5NjQ3OH0.mHTiaQwZhjLvxvIFfb1pgZ9CDdYK-60LdIrzAoeVgQc";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const bizSlug = params.get('biz');
  let currentBusiness = null;

  async function init(){
    if (!bizSlug) {
      showError();
      return;
    }
    const { data, error } = await client.from('businesses').select('*').eq('slug', bizSlug).maybeSingle();
    if (error || !data) {
      showError();
      return;
    }
    currentBusiness = data;
    document.getElementById('formTitle').textContent = `Share your experience with ${data.name}`;

    // Enforce the free-tier cap (15 testimonials) for businesses on the free plan.
    if (data.plan === 'free' || !data.plan) {
      const { count } = await client
        .from('Testimonials')
        .select('*', { count: 'exact', head: true })
        .eq('business_id', data.id);
      if (count !== null && count >= 15) {
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('errorCard').style.display = 'block';
        document.querySelector('#errorCard h1').textContent = 'Submissions paused';
        document.querySelector('#errorCard p').textContent = 'This business has reached its free plan limit for testimonials right now.';
      }
    }
  }

  function showError(){
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('errorCard').style.display = 'block';
  }

  let rating = 5;
  const starButtons = document.querySelectorAll('.star');
  function paintStars(val){
    starButtons.forEach(b => {
      b.style.color = Number(b.dataset.value) <= val ? 'var(--gold)' : 'var(--line)';
    });
  }
  paintStars(rating);
  starButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      rating = Number(btn.dataset.value);
      paintStars(rating);
    });
  });

  const form = document.getElementById('testimonialForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!currentBusiness) { showError(); return; }
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";
    msg.style.display = "none";

    const name = document.getElementById('name').value.trim();
    const role = document.getElementById('role').value.trim();
    const quote = document.getElementById('quote').value.trim();

    const { error } = await client.from('Testimonials').insert([{
      name: name, role: role, quote: quote, rating: rating,
      Approved: false, business_id: currentBusiness.id
    }]);

    if (error) {
      msg.className = "msg error";
      msg.textContent = "Something went wrong: " + error.message;
      msg.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit";
    } else {
      document.getElementById('formCard').style.display = "none";
      document.getElementById('doneCard').style.display = "block";
    }
  });

  init();
</script>

</body>
</html>
